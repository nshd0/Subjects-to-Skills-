  <head>

    <!-- Defensive Polyfills for Sandboxed Iframe Preview Environments -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // Polyfill IntersectionObserver if missing or throwing in sandbox
        if (!window.IntersectionObserver) {
          window.IntersectionObserver = class IntersectionObserver {
            constructor(callback) {
              this.callback = callback;
            }
            observe(target) {
              if (!target) return;
              setTimeout(() => {
                try {
                  var rect = target.getBoundingClientRect ? target.getBoundingClientRect() : { top: 0, bottom: 100, left: 0, right: 100, width: 100, height: 100 };
                  this.callback([{
                    isIntersecting: true,
                    intersectionRatio: 1,
                    target: target,
                    boundingClientRect: rect,
                    intersectionRect: rect,
                    rootBounds: null,
                    time: Date.now()
                  }], this);
                } catch (e) {}
              }, 16);
            }
            unobserve() {}
            disconnect() {}
            takeRecords() { return []; }
          };
          if (!window.IntersectionObserverEntry) {
            window.IntersectionObserverEntry = class IntersectionObserverEntry {};
          }
        }

        // Polyfill ResizeObserver if missing
        if (!window.ResizeObserver) {
          window.ResizeObserver = class ResizeObserver {
            constructor(callback) {
              this.callback = callback;
            }
            observe(target) {
              if (!target) return;
              setTimeout(() => {
                try {
                  var rect = target.getBoundingClientRect ? target.getBoundingClientRect() : { width: 100, height: 100 };
                  this.callback([{ target: target, contentRect: rect }], this);
                } catch (e) {}
              }, 16);
            }
            unobserve() {}
            disconnect() {}
          };
        }

        // Safe matchMedia stub
        if (!window.matchMedia || typeof window.matchMedia !== 'function') {
          window.matchMedia = function(query) {
            return {
              matches: false,
              media: query || '',
              onchange: null,
              addListener: function() {},
              removeListener: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
          };
        }

        // Safe scrollTo
        if (!window.scrollTo) {
          window.scrollTo = function() {};
        }

        function showFatalFallback(msg) {
          var rootEl = document.getElementById('root');
          if (rootEl && (!rootEl.firstElementChild || rootEl.firstElementChild.id === 's2s-preloader')) {
            var errBox = document.getElementById('s2s-error-fallback');
            if (!errBox) {
              rootEl.innerHTML = '<div id="s2s-error-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#f8fafc;text-align:center;">' +
                '<div style="max-width:440px;padding:32px;background:#1e293b;border-radius:16px;border:1px solid #334155;box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
                '<div style="width:48px;height:48px;border-radius:12px;background:#4f46e5;color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin-bottom:16px;">S</div>' +
                '<h2 style="margin:0 0 8px 0;font-size:18px;font-weight:700;">Subjects2Skills</h2>' +
                '<p style="margin:0 0 16px 0;font-size:13px;color:#94a3b8;line-height:1.5;">An unexpected initialization error occurred. Please click below to reload the app.</p>' +
                (msg ? '<p style="margin:0 0 16px 0;font-size:11px;color:#f87171;font-family:monospace;word-break:break-all;">' + String(msg).slice(0, 150) + '</p>' : '') +
                '<button onclick="window.location.reload()" style="background:#4f46e5;color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Reload Framework</button>' +
                '</div></div>';
            }
          }
        }

        // Global uncaught error listener to prevent silent blank screen
        window.addEventListener('error', function(event) {
          console.error('[Subjects2Skills Uncaught Error]', event.message, event.error);
          var preloader = document.getElementById('s2s-preloader');
          if (preloader && event && event.message && !event.message.includes('ResizeObserver')) {
            showFatalFallback(event.message);
          }
        });

        // Global unhandled rejection listener
        window.addEventListener('unhandledrejection', function(event) {
          console.error('[Subjects2Skills Unhandled Rejection]', event.reason);
        });

        // Defensive auto-dismiss for preloader: ensure user is NEVER stuck on loading screen
        setTimeout(function() {
          var preloader = document.getElementById('s2s-preloader');
          if (preloader) {
            preloader.style.transition = 'opacity 0.4s ease';
            preloader.style.opacity = '0';
            setTimeout(function() {
              if (preloader && preloader.parentNode) {
                preloader.parentNode.removeChild(preloader);
              }
            }, 400);
          }
        }, 1200);

        // Unregister any stale service workers in development iframe
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) {
              r.unregister();
            }
          }).catch(function() {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="showFatalFallback('Failed to initialize application scripts')"></script>
  </body>
</html>
